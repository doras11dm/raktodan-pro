<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অ্যাডমিন অ্যাপ - রক্তদান প্রো</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<body id="admin-body" class="bg-slate-950 text-slate-100 flex justify-center items-center h-screen overflow-hidden transition-colors duration-300">

    <!-- Standalone Container -->
    <div id="admin-container" class="w-full max-w-4xl bg-slate-900 h-full sm:h-[94vh] flex flex-col rounded-none sm:rounded-[2.5xl] shadow-2xl border-0 sm:border-[8px] sm:border-slate-800 overflow-hidden transition-colors duration-300">
        
        <!-- Header -->

            <div class="flex items-center space-x-3 cursor-pointer" onclick="refreshCurrentAdminTab()">

                    <i class="fa-solid fa-shield-halved text-base"></i>
                </div>
                <div>
                    <h1 class="font-bold text-sm sm:text-base leading-none">অ্যাডমিন কন্ট্রোল সেন্টার</h1>
                    <p class="text-[10px] sm:text-[11px] text-slate-400 mt-1 font-light">রক্তদান প্রো সার্বিক ড্যাশবোর্ড</p>
                </div>
            </div>

            <div class="flex items-center space-x-1.5 sm:space-x-2">
                <button onclick="refreshCurrentAdminTab()" id="global-refresh-btn" class="w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center text-xs transition" title="ডাটা রিফ্রেশ করুন">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>

                <button onclick="openAdminNotificationModal()" class="relative w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 text-amber-400 flex items-center justify-center text-xs transition" title="ইউজার রিকোয়েস্ট নোটিফিকেশন">
                    <i class="fa-solid fa-bell"></i>
                    <span id="admin-notif-badge" class="hidden absolute -top-1 -right-1 bg-red-600 text-white text-[9px] font-black w-4 h-4 rounded-full items-center justify-center shadow-lg animate-pulse">0</span>
                </button>

                <button onclick="toggleAdminTheme()" id="theme-toggle-btn" class="w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 text-amber-400 flex items-center justify-center text-sm transition" title="মোড পরিবর্তন">
                    <i class="fa-solid fa-sun"></i>
                </button>

                <button id="admin-logout-btn" onclick="handleAdminLogout()" class="hidden w-9 h-9 rounded-xl bg-rose-500/10 hover:bg-rose-500/20 text-rose-500 border border-rose-500/20 items-center justify-center text-sm transition" title="লগআউট">

        <!-- Main Screen -->
        <main id="admin-screen" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-5">
            <!-- Content Rendered by JS -->
        </main>
    </div>

    <!-- কাস্টম অ্যালার্ট মডাল -->
    <div id="admin-custom-alert-modal" class="hidden fixed inset-0 z-50 flex justify-center items-center p-4 bg-black/70 backdrop-blur-sm">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-xs p-5 rounded-3xl text-center space-y-3.5 shadow-2xl animate-custom-popup">
            <div id="admin-alert-icon-container" class="w-12 h-12 rounded-full mx-auto flex items-center justify-center text-xl shadow-inner bg-red-500/10 text-red-500">
                <i id="admin-alert-icon" class="fa-solid fa-bell"></i>
            </div>
            <div>
                <h3 id="admin-alert-title" class="font-bold text-white text-sm">বিজ্ঞপ্তি</h3>
                <p id="admin-alert-message" class="text-xs text-slate-400 mt-1 leading-relaxed whitespace-pre-line font-light"></p>
            </div>
            <button onclick="closeAdminAlert()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 rounded-xl text-xs shadow-md transition">
                ঠিক আছে

        </div>

    <!-- কাস্টম কনফার্ম মডাল -->
    <div id="admin-custom-confirm-modal" class="hidden fixed inset-0 z-50 flex justify-center items-center p-4 bg-black/70 backdrop-blur-sm">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-xs p-5 rounded-3xl text-center space-y-3.5 shadow-2xl animate-custom-popup">
            <div class="w-12 h-12 rounded-full mx-auto flex items-center justify-center text-xl shadow-inner bg-rose-500/10 text-rose-500">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <div>
                <h3 id="admin-confirm-title" class="font-bold text-white text-sm">সতর্কবার্তা</h3>
                <p id="admin-confirm-message" class="text-xs text-slate-400 mt-1 leading-relaxed whitespace-pre-line font-light"></p>
            </div>
            <div class="grid grid-cols-2 gap-2 pt-1">
                <button onclick="closeAdminConfirm(false)" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2.5 rounded-xl text-xs transition">
                    বাতিল
                </button>
                <button id="admin-confirm-ok-btn" onclick="closeAdminConfirm(true)" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-2.5 rounded-xl text-xs shadow-md transition">
                    হ্যাঁ, নিশ্চিত
                </button>
            </div>
        </div>
    </div>

    <!-- নোটিফিকেশন সেন্টার মডাল -->
    <div id="admin-notification-modal" class="hidden fixed inset-0 z-50 flex justify-center items-center p-4 bg-black/70 backdrop-blur-sm">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md p-5 rounded-3xl space-y-3.5 text-xs shadow-2xl max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center border-b border-slate-800 pb-2.5">
                <div class="flex items-center gap-2">
                    <h3 class="font-bold text-sm text-white flex items-center gap-1.5 text-amber-400">
                        <i class="fa-solid fa-bell"></i> ইউজার অনুরোধ নোটিফিকেশন
                    </h3>
                    <span id="notif-modal-count" class="bg-red-500/20 text-red-400 text-[10px] px-2 py-0.5 rounded-full font-bold border border-red-500/30">0 নতুন</span>
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="markAllAdminNotificationsRead()" class="text-[10px] text-slate-400 hover:text-emerald-400 transition">সব সিন</button>
                    <button onclick="closeAdminNotificationModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-sm"></i></button>
                </div>
            </div>
            <div id="admin-notification-list" class="flex-1 overflow-y-auto space-y-2.5 pr-1">
                <p class="text-center text-slate-500 py-6">কোনো নতুন নোটিফিকেশন নেই।</p>
            </div>
        </div>
    </div>

    <!-- হাসপাতাল এডিট মডাল -->
    <div id="edit-hospital-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex justify-center items-center p-4 z-50">
        <div id="modal-content" class="bg-slate-900 border border-slate-800 w-full max-w-md p-5 rounded-3xl space-y-3.5 text-xs shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-800 pb-2.5">
                <h3 class="font-bold text-sm text-white flex items-center gap-1.5 text-red-500">
                    <i class="fa-solid fa-pen-to-square"></i> হাসপাতালের তথ্য পরিবর্তন
                </h3>
                <button onclick="closeEditHospitalModal()" class="text-slate-400 hover:text-slate-200"><i class="fa-solid fa-xmark text-sm"></i></button>
            </div>
            <input type="hidden" id="edit-hosp-key">
            <div>
                <label class="block font-semibold text-slate-400 mb-1">হাসপাতালের নাম *</label>
                <input type="text" id="edit-hosp-name" class="w-full p-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white focus:outline-none focus:border-red-500">
            </div>
            <div>
                <label class="block font-semibold text-slate-400 mb-1">জেলা / লোকেশন *</label>
                <input type="text" id="edit-hosp-loc" class="w-full p-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white focus:outline-none focus:border-red-500">
            </div>
            <div>
                <label class="block font-semibold text-slate-400 mb-1">হটলাইন নম্বর *</label>
                <input type="text" id="edit-hosp-phone" class="w-full p-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white focus:outline-none focus:border-red-500">
            </div>
            <button onclick="saveHospitalEdits()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl shadow transition">
                আপডেট সংরক্ষণ করুন (Update)
            </button>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getDatabase, ref, get, set, push, remove, update, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAHjKWzi5-dmQ6Fw51BNyzWcnInezwPaYk",
            authDomain: "raktodan-de85f.firebaseapp.com",
            databaseURL: "https://raktodan-de85f-default-rtdb.asia-southeast1.firebasedatabase.app", 
            projectId: "raktodan-de85f",
            storageBucket: "raktodan-de85f.firebasestorage.app",
            messagingSenderId: "914022602552",
            appId: "1:914022602552:web:17d354100b0b7ba43553cd",
            measurementId: "G-0PP0CWKVKY"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const rtdb = getDatabase(app, "https://raktodan-de85f-default-rtdb.asia-southeast1.firebasedatabase.app");

        let currentAdminUser = null;
        let adminAuthMode = 'login';
        let currentTheme = localStorage.getItem('admin_theme') || 'dark';
        let currentActiveTab = 'donors';
        let adminNotifications = [];
        let allUsersDataList = []; // সার্চিং এর জন্য ইউজার ক্যাশ

        window.alert = function(message) {
            const modal = document.getElementById('admin-custom-alert-modal');
            const msgEl = document.getElementById('admin-alert-message');
            const titleEl = document.getElementById('admin-alert-title');
            const iconContainer = document.getElementById('admin-alert-icon-container');
            const icon = document.getElementById('admin-alert-icon');

            if(!modal || !msgEl) return;
            msgEl.innerText = message;

            if (message.includes('সফল') || message.includes('অভিনন্দন') || message.includes('Success')) {
                titleEl.innerText = "সফল হয়েছে!";
                iconContainer.className = "w-12 h-12 rounded-full mx-auto flex items-center justify-center text-xl shadow-inner bg-emerald-500/10 text-emerald-500";
                icon.className = "fa-solid fa-circle-check";
            } else if (message.includes('ভুল') || message.includes('ব্যর্থ') || message.includes('সমস্যা') || message.includes('ত্রুটি') || message.includes('সতর্কতা')) {
                titleEl.innerText = "সতর্কবার্তা";
                iconContainer.className = "w-12 h-12 rounded-full mx-auto flex items-center justify-center text-xl shadow-inner bg-rose-500/10 text-rose-500";
                icon.className = "fa-solid fa-triangle-exclamation";
            } else {
                titleEl.innerText = "বিজ্ঞপ্তি";
                iconContainer.className = "w-12 h-12 rounded-full mx-auto flex items-center justify-center text-xl shadow-inner bg-red-500/10 text-red-500";
                icon.className = "fa-solid fa-bell";
            }
            modal.classList.remove('hidden');
        };

        window.closeAdminAlert = function() {
            const modal = document.getElementById('admin-custom-alert-modal');
            if(modal) modal.classList.add('hidden');
        };

        let adminConfirmCallback = null;
        window.showAdminConfirm = function(title, message, confirmBtnText, callback) {
            const modal = document.getElementById('admin-custom-confirm-modal');
            const titleEl = document.getElementById('admin-confirm-title');
            const msgEl = document.getElementById('admin-confirm-message');
            const okBtn = document.getElementById('admin-confirm-ok-btn');

            if(!modal) return;
            titleEl.innerText = title || "সতর্কবার্তা";
            msgEl.innerText = message;
            if(confirmBtnText) okBtn.innerText = confirmBtnText;

            adminConfirmCallback = callback;
            modal.classList.remove('hidden');
        };

        window.closeAdminConfirm = function(isConfirmed) {
            const modal = document.getElementById('admin-custom-confirm-modal');
            if(modal) modal.classList.add('hidden');
            if(isConfirmed && typeof adminConfirmCallback === 'function') {
                adminConfirmCallback();
            }
            adminConfirmCallback = null;
        };

        window.applyTheme = function() {
            const body = document.getElementById('admin-body');
            const container = document.getElementById('admin-container');
            const header = document.getElementById('admin-header');
            const toggleBtn = document.getElementById('theme-toggle-btn');
            const modalContent = document.getElementById('modal-content');

            if(currentTheme === 'light') {
                body.className = "bg-slate-100 text-slate-800 flex justify-center items-center h-screen overflow-hidden transition-colors duration-300";
                container.className = "w-full max-w-4xl bg-white h-full sm:h-[94vh] flex flex-col rounded-none sm:rounded-[2.5xl] shadow-2xl border-0 sm:border-[8px] sm:border-slate-300 overflow-hidden transition-colors duration-300";
                header.className = "bg-white px-4 sm:px-5 py-3.5 flex justify-between items-center border-b border-slate-200 shrink-0 transition-colors duration-300";
                toggleBtn.innerHTML = '<i class="fa-solid fa-moon"></i>';
                toggleBtn.className = "w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center text-sm transition";
                if(modalContent) modalContent.className = "bg-white border border-slate-200 w-full max-w-md p-5 rounded-3xl space-y-3.5 text-xs shadow-2xl text-slate-800";
            } else {
                body.className = "bg-slate-950 text-slate-100 flex justify-center items-center h-screen overflow-hidden transition-colors duration-300";
                container.className = "w-full max-w-4xl bg-slate-900 h-full sm:h-[94vh] flex flex-col rounded-none sm:rounded-[2.5xl] shadow-2xl border-0 sm:border-[8px] sm:border-slate-800 overflow-hidden transition-colors duration-300";
                header.className = "bg-slate-900 px-4 sm:px-5 py-3.5 flex justify-between items-center border-b border-slate-800 shrink-0 transition-colors duration-300";
                toggleBtn.innerHTML = '<i class="fa-solid fa-sun"></i>';
                toggleBtn.className = "w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 text-amber-400 flex items-center justify-center text-sm transition";
                if(modalContent) modalContent.className = "bg-slate-900 border border-slate-800 w-full max-w-md p-5 rounded-3xl space-y-3.5 text-xs shadow-2xl text-white";
            }
        };

        window.toggleAdminTheme = function() {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            localStorage.setItem('admin_theme', currentTheme);
            applyTheme();
            if(currentAdminUser) renderAdminDashboard();
            else renderAdminAuthScreen();
        };

        onAuthStateChanged(auth, (user) => {
            currentAdminUser = user;
            const logoutBtn = document.getElementById('admin-logout-btn');
            if(user) {
                logoutBtn.classList.remove('hidden');
                logoutBtn.classList.add('flex');
                renderAdminDashboard();
                initAdminNotificationsLiveTracker();
            } else {
                logoutBtn.classList.remove('flex');
                logoutBtn.classList.add('hidden');
                renderAdminAuthScreen();
            }
        });

        window.refreshCurrentAdminTab = function() {
            const refBtn = document.getElementById('global-refresh-btn');
            if(refBtn) refBtn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i>';

            loadAdminStats();
            if (currentActiveTab === 'donors') loadAdminDonors();
            else if (currentActiveTab === 'requests') loadAdminRequests();
            else if (currentActiveTab === 'users') loadAdminUsers();
            else if (currentActiveTab === 'hospitals') loadAdminHospitals();
            else if (currentActiveTab === 'developer') loadDeveloperInfoInAdmin();
            else if (currentActiveTab === 'ads') loadAdSettingsInAdmin();

            setTimeout(() => {
                if(refBtn) refBtn.innerHTML = '<i class="fa-solid fa-rotate-right"></i>';
            }, 600);
        };

        function initAdminNotificationsLiveTracker() {
            onSnapshot(collection(db, "bloodRequests"), () => {
                updateAdminNotificationList();
            });
            onValue(ref(rtdb, 'donors'), () => {
                updateAdminNotificationList();
            });
        }

        async function updateAdminNotificationList() {
            try {
                const seenNotifs = JSON.parse(localStorage.getItem('admin_seen_notifs') || '[]');
                const deletedNotifs = JSON.parse(localStorage.getItem('admin_deleted_notifs') || '[]');
                let list = [];

                const reqSnap = await getDocs(collection(db, "bloodRequests"));
                reqSnap.forEach(d => {
                    const data = d.data();
                    const notifId = 'req_' + d.id;
                    if (!deletedNotifs.includes(notifId)) {
                        list.push({
                            id: notifId,
                            type: 'request',
                            title: `🩸 নতুন রক্তের অনুরোধ (${data.group})`,
                            body: `${data.name} এর জন্য ${data.bag || 1} ব্যাগ রক্ত প্রয়োজন। হাসপাতাল: ${data.hosp}`,
                            time: data.timestamp || Date.now(),
                            isSeen: seenNotifs.includes(notifId)
                        });
                    }
                });

                const donorSnap = await get(ref(rtdb, 'donors'));
                if (donorSnap.exists()) {
                    Object.entries(donorSnap.val()).forEach(([key, val]) => {
                        if (val.status === 'Pending') {
                            const notifId = 'donor_' + key;
                            if (!deletedNotifs.includes(notifId)) {
                                list.push({
                                    id: notifId,
                                    type: 'donor',
                                    title: `👥 নতুন ডোনার আবেদন (${val.group})`,
                                    body: `${val.name} রক্তদাতা হতে আবেদন করেছেন। জেলা: ${val.district}`,
                                    time: val.timestamp || Date.now(),
                                    isSeen: seenNotifs.includes(notifId)
                                });
                            }
                        }
                    });
                }

                list.sort((a, b) => b.time - a.time);
                adminNotifications = list;

                const unseenCount = list.filter(n => !n.isSeen).length;
                const badge = document.getElementById('admin-notif-badge');
                const modalCount = document.getElementById('notif-modal-count');

                if (badge) {
                    if (unseenCount > 0) {
                        badge.innerText = unseenCount;
                        badge.classList.remove('hidden');
                        badge.classList.add('flex');
                    } else {
                        badge.classList.remove('flex');
                        badge.classList.add('hidden');
                    }
                }
                if (modalCount) modalCount.innerText = `${unseenCount} নতুন`;

                renderAdminNotificationListUI();
            } catch(e) {
                console.error("Notif error:", e);
            }
        }

        function renderAdminNotificationListUI() {
            const container = document.getElementById('admin-notification-list');
            if(!container) return;

            if (adminNotifications.length === 0) {
                container.innerHTML = '<p class="text-center text-slate-500 py-8 text-xs">কোনো নতুন অনুরোধ নোটিফিকেশন নেই।</p>';
                return;
            }

            container.innerHTML = "";
            adminNotifications.forEach(n => {
                container.innerHTML += `
                    <div id="notif-card-${n.id}" class="swipe-item p-3 ${n.isSeen ? 'bg-slate-950/60 border-slate-800/60 opacity-75' : 'bg-slate-950 border-red-500/30 shadow-md'} border rounded-2xl flex justify-between items-start gap-2.5 transition">
                        <div onclick="markSingleAdminNotifRead('${n.id}')" class="flex-1 cursor-pointer">
                            <div class="flex items-center gap-1.5">
                                ${!n.isSeen ? '<span class="w-2 h-2 rounded-full bg-red-500 shrink-0"></span>' : ''}
                                <h4 class="font-bold text-white text-xs">${n.title}</h4>
                            </div>
                            <p class="text-[11px] text-slate-400 mt-1 leading-relaxed">${n.body}</p>
                            <span class="text-[9px] text-slate-500 block mt-1"><i class="fa-solid fa-clock mr-1"></i>${new Date(n.time).toLocaleTimeString('bn-BD')}</span>
                        </div>
                        <button onclick="deleteSingleAdminNotif('${n.id}')" class="p-1.5 text-slate-500 hover:text-rose-500 text-xs transition" title="ডিলিট করুন">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                `;
            });
        }

        window.openAdminNotificationModal = function() {
            document.getElementById('admin-notification-modal').classList.remove('hidden');
            renderAdminNotificationListUI();
        };

        window.closeAdminNotificationModal = function() {
            document.getElementById('admin-notification-modal').classList.add('hidden');

        window.switchAdminTab = function(tabName) {
            currentActiveTab = tabName;

            document.querySelectorAll('.admin-tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.admin-tab-btn').forEach(btn => {
                btn.className = `admin-tab-btn ${isLight ? 'bg-slate-100 text-slate-600' : 'bg-slate-950 text-slate-400'} px-4 py-2.5 rounded-xl text-xs font-semibold whitespace-nowrap transition`;
            });
            document.getElementById(`admin-tab-${tabName}`).classList.remove('hidden');
            let activeBtn = document.getElementById(`tab-btn-${tabName}`);
            activeBtn.className = "admin-tab-btn bg-red-600 text-white px-4 py-2.5 rounded-xl text-xs font-semibold whitespace-nowrap transition shadow";
        };

        window.loadAdminStats = async function() {
            try {
                const userSnap = await get(ref(rtdb, 'users'));
                let userCount = userSnap.exists() ? Object.keys(userSnap.val()).length : 0;
                const statUsers = document.getElementById('stat-users');
                if (statUsers) statUsers.innerText = userCount;

                const reqSnap = await getDocs(collection(db, "bloodRequests"));
                const statReqs = document.getElementById('stat-requests');
                if (statReqs) statReqs.innerText = reqSnap.size;

                const donorSnap = await get(ref(rtdb, 'donors'));
                const statDonors = document.getElementById('stat-donors');
                const statPending = document.getElementById('stat-pending');

                if(donorSnap.exists()) {
                    let donors = Object.values(donorSnap.val());
                    let approvedCount = donors.filter(d => d.status === 'Approved').length;
                    let pendingCount = donors.filter(d => d.status === 'Pending').length;
                    if (statDonors) statDonors.innerText = approvedCount;
                    if (statPending) statPending.innerText = pendingCount;
                } else {
                    if (statDonors) statDonors.innerText = 0;
                    if (statPending) statPending.innerText = 0;
                }
            } catch(e) {
                console.error("Stats Error:", e);
            }
        };

        window.loadAdminDonors = async function() {
            let container = document.getElementById('admin-donors-list');
            const isLight = currentTheme === 'light';
            try {
                const donorsRef = ref(rtdb, 'donors');
                const snapshot = await get(donorsRef);
                container.innerHTML = "";
                if(!snapshot.exists()) {
                    container.innerHTML = `<div class="${isLight ? 'bg-white border-slate-200 text-slate-500' : 'bg-slate-950 border-slate-800 text-slate-500'} p-6 rounded-2xl text-center text-xs border">কোনো ডোনারের আবেদন নেই।</div>`;
                    return;
                }
                const data = snapshot.val();
                let donorEntries = Object.entries(data);

                donorEntries.sort((a, b) => {
                    if (a[1].status === 'Pending' && b[1].status !== 'Pending') return -1;
                    if (a[1].status !== 'Pending' && b[1].status === 'Pending') return 1;
                    return (b[1].timestamp || 0) - (a[1].timestamp || 0);
                });

                donorEntries.forEach(([key, d]) => {
                    let isApproved = d.status === 'Approved';
                    let displayLoc = `${d.upazila ? d.upazila + ', ' : ''}${d.district || ''}`;
                    let btnApprove = !isApproved ? `<button onclick="approveDonor('${key}')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-xl text-xs font-semibold transition flex items-center gap-1 shadow"><i class="fa-solid fa-check"></i> অনুমোদন</button>` : '';

                    container.innerHTML += `
                        <div class="p-3.5 ${isLight ? 'bg-white border-slate-200' : 'bg-slate-950 border-slate-800'} border rounded-2xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2.5 text-xs shadow-sm">
                            <div>
                                <div class="flex items-center gap-2">
                                    <span class="font-bold ${isLight ? 'text-slate-800' : 'text-white'} text-sm">${d.name}</span>
                                    <span class="bg-red-500/10 text-red-500 border border-red-500/20 px-2 py-0.5 rounded font-black text-[11px]">${d.group}</span>
                                    <span class="text-[10px] ${isApproved ? 'text-emerald-500 bg-emerald-500/10' : 'text-amber-500 bg-amber-500/10'} px-2 py-0.5 rounded font-semibold border ${isApproved ? 'border-emerald-500/20' : 'border-amber-500/20'}">
                                        ${isApproved ? 'অনুমোদিত' : 'পেন্ডিং'}
                                    </span>
                                </div>
                                <p class="text-slate-400 mt-1 text-[11px]">
                                    <i class="fa-solid fa-phone text-slate-500 mr-1"></i>${d.phone} 
                                    <span class="mx-1 text-slate-600">|</span> 
                                    <i class="fa-solid fa-location-dot text-slate-500 mr-1"></i>${displayLoc}
                                    <span class="mx-1 text-slate-600">|</span> 
                                    মোট দান: <b class="${isLight ? 'text-slate-700' : 'text-slate-300'}">${d.totalDonated || 0} বার</b>
                                </p>
                            </div>
                            <div class="flex items-center space-x-1.5 self-end sm:self-auto">
                                ${btnApprove}
                                <button onclick="deleteDonor('${key}')" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-xl text-xs font-semibold transition flex items-center gap-1 shadow">
                                    <i class="fa-solid fa-trash-can"></i> ডিলিট
                                </button>
                            </div>
                        </div>
                    `;
                });
            } catch(e) {
                container.innerHTML = '<p class="text-red-500 text-xs text-center py-4">ডোনার লোড করতে ত্রুটি ঘটেছে।</p>';
            }
        };

                loadAdminDonors();

            } catch(e) {

                querySnapshot.forEach((docSnap) => {

                    container.innerHTML += `

                                <p class="text-slate-400 mt-1 text-[11px]">

                                </p>
                            </div>
                            <button onclick="deleteRequest('${id}')" class="self-end sm:self-auto bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-xl text-xs font-semibold transition flex items-center gap-1 shadow">
                                <i class="fa-solid fa-trash-can"></i> পোস্ট মুছুন
                            </button>

                });
            } catch(e) {

        window.deleteRequest = function(id) {

                try {
                    await deleteDoc(doc(db, "bloodRequests", id));

                }

        // 🌟 ইউজার ডেটা লোড ও সার্চ ক্যাশিং
        window.loadAdminUsers = async function() {
            let container = document.getElementById('admin-users-list');
            const isLight = currentTheme === 'light';
            try {
                const snap = await get(ref(rtdb, 'users'));
                allUsersDataList = [];
                if(!snap.exists()) {
                    container.innerHTML = `<div class="${isLight ? 'bg-white border-slate-200 text-slate-500' : 'bg-slate-950 border-slate-800 text-slate-500'} p-6 rounded-2xl text-center text-xs border">কোনো ইউজার তালিকাভুক্ত নেই।</div>`;
                    return;
                }
                const users = snap.val();
                Object.entries(users).forEach(([phoneKey, u]) => {
                    allUsersDataList.push({ phoneKey, ...u });
                });
                renderAdminUsersList(allUsersDataList);
            } catch(e) {
                container.innerHTML = '<p class="text-red-500 text-xs text-center py-4">ইউজার লোড সমস্যা।</p>';
            }
        };

        // ইউজার তালিকা রেন্ডার ফাংশন (ব্লক এবং ১০০% পারফেক্ট ডিলিট সহ)
        function renderAdminUsersList(users) {
            let container = document.getElementById('admin-users-list');
            const isLight = currentTheme === 'light';
            container.innerHTML = "";

            if (users.length === 0) {
                container.innerHTML = `<div class="${isLight ? 'bg-white border-slate-200 text-slate-500' : 'bg-slate-950 border-slate-800 text-slate-500'} p-6 rounded-2xl text-center text-xs border">কোনো ব্যবহারকারী পাওয়া যায়নি।</div>`;
                return;
            }

            users.forEach(u => {
                let isBlocked = u.isBlocked === true;
                container.innerHTML += `
                    <div class="p-3.5 ${isLight ? 'bg-white border-slate-200' : 'bg-slate-950 border-slate-800'} border rounded-2xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2.5 text-xs shadow-sm">
                        <div>
                            <div class="flex items-center gap-2">
                                <b class="${isLight ? 'text-slate-800' : 'text-white'} text-sm">${u.name || 'বেনামী ব্যবহারকারী'}</b>
                                <span class="text-[10px] ${isBlocked ? 'text-rose-500 bg-rose-500/10 border-rose-500/20' : 'text-emerald-500 bg-emerald-500/10 border-emerald-500/20'} px-2 py-0.5 rounded-md font-semibold border">
                                    ${isBlocked ? 'ব্লকড' : 'সক্রিয়'}
                                </span>
                            </div>
                            <p class="text-slate-400 text-[11px] mt-1">
                                <i class="fa-solid fa-phone text-slate-500 mr-1"></i><span class="font-mono">${u.phoneKey}</span>
                                <span class="mx-1.5 text-slate-600">|</span> 
                                রোল: <span class="capitalize">${u.role || 'donor'}</span>
                            </p>
                        </div>
                        <div class="flex items-center space-x-2 self-end sm:self-auto">
                            <button onclick="toggleBlockUser('${u.phoneKey}', ${isBlocked})" class="${isBlocked ? 'bg-emerald-600 hover:bg-emerald-700' : 'bg-amber-600 hover:bg-amber-700'} text-white px-3 py-1.5 rounded-xl text-xs font-semibold transition shadow">
                                ${isBlocked ? 'আনব্লক' : 'ব্লক করুন'}
                            </button>
                            <button onclick="deleteRegisteredUserPermanent('${u.phoneKey}')" class="bg-rose-600 hover:bg-rose-700 text-white px-3 py-1.5 rounded-xl text-xs font-semibold transition flex items-center gap-1 shadow" title="চিরতরে মুছে ফেলুন">
                                <i class="fa-solid fa-trash-can"></i> ডিলিট
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        // 🔍 লাইভ ইউজার সার্চ ফিল্টার
        window.filterAdminUsersList = function(query) {
            query = (query || '').toLowerCase().trim();
            if(!query) {
                renderAdminUsersList(allUsersDataList);
            } else {
                const filtered = allUsersDataList.filter(u => 
                    (u.name || '').toLowerCase().includes(query) || 
                    (u.phoneKey || '').includes(query) ||
                    (u.phone || '').includes(query) ||
                    (u.role || '').toLowerCase().includes(query)
                );
                renderAdminUsersList(filtered);
            }
        };

        // 🗑️ ফায়ারবেস থেকে ১০০% স্থায়ীভাবে ইউজার মুছে ফেলা (Cascade Delete)
        window.deleteRegisteredUserPermanent = function(phoneKey) {
            showAdminConfirm(
                'ইউজার চিরতরে ডিলিট!',
                `আপনি কি নিশ্চিত যে (${phoneKey}) ব্যবহারকারীকে ডাটাবেজ থেকে সম্পূর্ণ মুছে ফেলতে চান?\nতার ডোনার প্রোফাইল ও যাবতীয় তথ্যও স্বয়ংক্রিয়ভাবে মুছে যাবে।`,
                'হ্যাঁ, চিরতরে মুছুন',
                async () => {
                    try {
                        // ১. ইউজার টেবিল থেকে ডিলিট
                        await remove(ref(rtdb, `users/${phoneKey}`));

                        // ২. ওটিপি টেবিল পরিষ্কার
                        await remove(ref(rtdb, `sms_otps/${phoneKey}`));

                        // ৩. ডোনার তালিকা থেকে ওই নম্বরের প্রোফাইল খুঁজে ডিলিট
                        const donorSnap = await get(ref(rtdb, 'donors'));
                        if (donorSnap.exists()) {
                            donorSnap.forEach(child => {
                                const val = child.val();
                                if (val.uid === phoneKey || val.phone === phoneKey) {
                                    remove(ref(rtdb, `donors/${child.key}`));
                                }
                            });
                        }

                        alert('ব্যবহারকারী ও তার সকল ডাটা সফলভাবে ফায়ারবেস থেকে চিরতরে মুছে ফেলা হয়েছে!');
                        loadAdminUsers();
                        loadAdminStats();
                        loadAdminDonors();
                    } catch(e) {
                        alert('ডিলিট ব্যর্থ হয়েছে: ' + e.message);
                    }
                }
            );
        };

        window.toggleBlockUser = async function(phoneKey, currentStatus) {
            try {
                await update(ref(rtdb, `users/${phoneKey}`), { isBlocked: !currentStatus });
                alert('ইউজারের ব্লকিং স্ট্যাটাস সফলভাবে পরিবর্তন করা হয়েছে!');
                loadAdminUsers();
            } catch(e) {
                alert('ত্রুটি: ' + e.message);
            }
        };

        window.addNewHospital = async function() {
            let name = document.getElementById('h-name').value.trim();
            let location = document.getElementById('h-loc').value.trim();
            let phone = document.getElementById('h-phone').value.trim();

            if(!name || !location || !phone) {
                alert('হাসপাতালের নাম, লোকেশন এবং হটলাইন নম্বর দিন!');
                return;
            }

            try {
                const newHospRef = push(ref(rtdb, 'hospitals'));
                await set(newHospRef, { name, location, phone });
                alert('নতুন হাসপাতাল সফলভাবে ডাটাবেজে যুক্ত হয়েছে!');
                document.getElementById('h-name').value = "";
                document.getElementById('h-loc').value = "";
                document.getElementById('h-phone').value = "";
                loadAdminHospitals();
            } catch(e) {
                alert('হাসপাতাল সেভ ব্যর্থ: ' + e.message);
            }
        };

        window.loadAdminHospitals = async function() {
            let container = document.getElementById('admin-hospitals-list');
            const isLight = currentTheme === 'light';
            try {
                const hospRef = ref(rtdb, 'hospitals');
                const snapshot = await get(hospRef);
                container.innerHTML = "";
                if(!snapshot.exists()) {
                    container.innerHTML = `<div class="${isLight ? 'bg-white border-slate-200 text-slate-500' : 'bg-slate-950 border-slate-800 text-slate-500'} p-6 rounded-2xl text-center text-xs border">কোনো হাসপাতাল যুক্ত নেই।</div>`;
                    return;
                }
                const data = snapshot.val();
                Object.entries(data).forEach(([key, h]) => {
                    container.innerHTML += `
                        <div class="p-3.5 ${isLight ? 'bg-white border-slate-200' : 'bg-slate-950 border-slate-800'} border rounded-2xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 text-xs shadow-sm">
                            <div>
                                <b class="${isLight ? 'text-slate-800' : 'text-white'} text-sm">${h.name}</b>
                                <p class="text-slate-400 mt-0.5"><i class="fa-solid fa-location-dot text-red-500 mr-1"></i>${h.location} | <i class="fa-solid fa-phone text-slate-500 mr-1"></i>${h.phone}</p>
                            </div>
                            <div class="flex items-center space-x-1.5 self-end sm:self-auto">
                                <button onclick="openEditHospitalModal('${key}', '${h.name}', '${h.location}', '${h.phone}')" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-1.5 rounded-xl text-xs font-semibold transition flex items-center gap-1">
                                    <i class="fa-solid fa-pen"></i> এডিট
                                </button>
                                <button onclick="deleteHospital('${key}')" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-xl text-xs font-semibold transition flex items-center gap-1">
                                    <i class="fa-solid fa-trash-can"></i> মুছুন
                                </button>
                            </div>
                        </div>
                    `;
                });
            } catch(e) {
                container.innerHTML = '<p class="text-red-500 text-xs text-center py-4">হাসপাতাল লোড সমস্যা।</p>';
            }
        };

        window.openEditHospitalModal = function(key, name, loc, phone) {
            document.getElementById('edit-hosp-key').value = key;
            document.getElementById('edit-hosp-name').value = name;
            document.getElementById('edit-hosp-loc').value = loc;
            document.getElementById('edit-hosp-phone').value = phone;
            document.getElementById('edit-hospital-modal').classList.remove('hidden');
        };

        window.closeEditHospitalModal = function() {
            document.getElementById('edit-hospital-modal').classList.add('hidden');
        };

        window.saveHospitalEdits = async function() {
            const key = document.getElementById('edit-hosp-key').value;
            const name = document.getElementById('edit-hosp-name').value.trim();
            const location = document.getElementById('edit-hosp-loc').value.trim();
            const phone = document.getElementById('edit-hosp-phone').value.trim();

            if(!name || !location || !phone) {
                alert('সকল ফিল্ড পূরণ করা আবশ্যক!');
                return;
            }

            try {
                await update(ref(rtdb, `hospitals/${key}`), { name, location, phone });
                alert('হাসপাতালের তথ্য সফলভাবে আপডেট করা হয়েছে!');
                closeEditHospitalModal();
                loadAdminHospitals();
            } catch(e) {
                alert('আপডেট ব্যর্থ: ' + e.message);
            }
        };

        window.deleteHospital = function(key) {
            showAdminConfirm('হাসপাতাল মুছে ফেলা', 'হাসপাতালটি স্থায়ীভাবে তালিকা থেকে বাদ দিতে চান?', 'হ্যাঁ, মুছুন', async () => {
                try {
                    await remove(ref(rtdb, `hospitals/${key}`));
                    alert('হাসপাতাল সফলভাবে মুছে ফেলা হয়েছে!');
                    loadAdminHospitals();
                } catch(e) {
                    alert('ডিলিট ব্যর্থ: ' + e.message);
                }
            });
        };

        window.loadDeveloperInfoInAdmin = async function() {
            try {
                const devSnap = await get(ref(rtdb, 'developer_info'));
                if(devSnap.exists()) {
                    const data = devSnap.val();
                    if(document.getElementById('dev-name')) document.getElementById('dev-name').value = data.name || '';
                    if(document.getElementById('dev-role')) document.getElementById('dev-role').value = data.role || '';
                    if(document.getElementById('dev-org')) document.getElementById('dev-org').value = data.organization || '';
                    if(document.getElementById('dev-logo')) document.getElementById('dev-logo').value = data.logo || '';
                    if(document.getElementById('dev-phone')) document.getElementById('dev-phone').value = data.phone || '';
                    if(document.getElementById('dev-whatsapp')) document.getElementById('dev-whatsapp').value = data.whatsapp || '';
                    if(document.getElementById('dev-email')) document.getElementById('dev-email').value = data.email || '';
                    if(document.getElementById('dev-address')) document.getElementById('dev-address').value = data.address || '';
                    if(document.getElementById('dev-facebook')) document.getElementById('dev-facebook').value = data.facebook || '';
                    if(document.getElementById('dev-telegram')) document.getElementById('dev-telegram').value = data.telegram || '';
                    if(document.getElementById('dev-website')) document.getElementById('dev-website').value = data.website || '';
                }
            } catch(e) {
                console.error("Developer load error:", e);
            }
        };

        window.saveDeveloperInfoSettings = async function() {
            const name = document.getElementById('dev-name').value.trim();
            const role = document.getElementById('dev-role').value.trim();
            const organization = document.getElementById('dev-org').value.trim();
            const logo = document.getElementById('dev-logo').value.trim();
            const phone = document.getElementById('dev-phone').value.trim();
            const whatsapp = document.getElementById('dev-whatsapp').value.trim();
            const email = document.getElementById('dev-email').value.trim();
            const address = document.getElementById('dev-address').value.trim();
            const facebook = document.getElementById('dev-facebook').value.trim();
            const telegram = document.getElementById('dev-telegram').value.trim();
            const website = document.getElementById('dev-website').value.trim();

            if(!name) {
                alert('দয়া করে অন্তত ডেভেলপারের নাম লিখুন!');
                return;
            }

            try {
                await set(ref(rtdb, 'developer_info'), {
                    name, role, organization, logo, phone, whatsapp, email, address, facebook, telegram, website,
                    updatedAt: Date.now()
                });
                alert('✅ অভিনন্দন! ডেভেলপার তথ্য সফলভাবে ডাটাবেজে আপডেট হয়েছে।');
            } catch(e) {
                alert('ডেভেলপার তথ্য সেভ ব্যর্থ: ' + e.message);
            }
        };

        window.loadAdSettingsInAdmin = async function() {
            try {
                const adSnap = await get(ref(rtdb, 'ad_settings'));
                if (adSnap.exists()) {
                    const data = adSnap.val();
                    if (document.getElementById('ad-global-switch')) document.getElementById('ad-global-switch').checked = data.enabled || false;
                    if (document.getElementById('ad-active-network')) document.getElementById('ad-active-network').value = data.network || 'adsterra';
                    if (document.getElementById('ad-placement-type')) document.getElementById('ad-placement-type').value = data.placement || 'banner';
                    if (document.getElementById('ad-adsterra-banner')) document.getElementById('ad-adsterra-banner').value = data.adsterraBanner || '';
                    if (document.getElementById('ad-adsterra-smartlink')) document.getElementById('ad-adsterra-smartlink').value = data.adsterraSmartlink || '';
                    if (document.getElementById('ad-startio-appid')) document.getElementById('ad-startio-appid').value = data.startioAppId || '';
                    if (document.getElementById('ad-startio-format')) document.getElementById('ad-startio-format').value = data.startioFormat || 'banner';
                }
            } catch(e) {
                console.error("Ad settings load error:", e);
            }
        };

        window.saveAdNetworkSettings = async function() {
            const enabled = document.getElementById('ad-global-switch').checked;
            const network = document.getElementById('ad-active-network').value;
            const placement = document.getElementById('ad-placement-type').value;
            const adsterraBanner = document.getElementById('ad-adsterra-banner').value.trim();
            const adsterraSmartlink = document.getElementById('ad-adsterra-smartlink').value.trim();
            const startioAppId = document.getElementById('ad-startio-appid').value.trim();
            const startioFormat = document.getElementById('ad-startio-format').value;

            try {
                await set(ref(rtdb, 'ad_settings'), {
                    enabled,
                    network,
                    placement,
                    adsterraBanner,
                    adsterraSmartlink,
                    startioAppId,
                    startioFormat,
                    updatedAt: Date.now()
                });
                alert('✅ সফল হয়েছে! বিজ্ঞাপন সেটিংস ডাটাবেজে সেভ হয়েছে। ইউজার অ্যাপে এখনই কার্যকর হবে।');
            } catch(e) {
                alert('বিজ্ঞাপন সেটিংস সেভ করতে ব্যর্থ: ' + e.message);
            }
        };

        applyTheme();
    </script>
</body>
</html>
