        window.alert = function(message) {
            const modal = document.getElementById('inapp-custom-alert-modal');
            const msgEl = document.getElementById('inapp-alert-message');
            const titleEl = document.getElementById('inapp-alert-title');
            const iconContainer = document.getElementById('inapp-alert-icon-container');
            const icon = document.getElementById('inapp-alert-icon');

            if(!modal || !msgEl) return;
            msgEl.innerText = message;

            if (message.includes('সফল') || message.includes('অভিনন্দন') || message.includes('Success')) {
                titleEl.innerText = "সফল হয়েছে!";

            modal.classList.remove('hidden');

            let p = (phone || '').replace(/[^0-9]/g, '');

        function formatBanglaDate(dateStr) {
            if(!dateStr) return 'শীঘ্রই';
            try {
                const dateObj = new Date(dateStr);
                if(isNaN(dateObj.getTime())) return dateStr;
                const months = ['জানুয়ারি', 'ফেব্রুয়ারি', 'মার্চ', 'এপ্রিল', 'মে', 'জুন', 'জুলাই', 'আগস্ট', 'সেপ্টেম্বর', 'অক্টোবর', 'নভেম্বর', 'ডিসেম্বর'];
                const banglaNumbers = {'0':'০','1':'১','2':'২','3':'৩','4':'৪','5':'৫','6':'৬','7':'৭','8':'৮','9':'৯'};

                const day = dateObj.getDate().toString().replace(/\d/g, d => banglaNumbers[d]);
                const month = months[dateObj.getMonth()];
                const year = dateObj.getFullYear().toString().replace(/\d/g, d => banglaNumbers[d]);

                return `${day} ${month}, ${year}`;
            } catch(e) {
                return dateStr;
            }
        }

        function getWhatsAppLink(phone, donorName) {
            let cleanPhone = (phone || '').replace(/[^0-9]/g, '');
            if (cleanPhone.startsWith('0')) {
                cleanPhone = '88' + cleanPhone;
            } else if (!cleanPhone.startsWith('88') && cleanPhone.length === 10) {
                cleanPhone = '880' + cleanPhone;
            }
            const msg = encodeURIComponent(`আসসালামু আলাইকুম ${donorName || ''}, রক্তদান প্রো প্ল্যাটফর্ম থেকে জরুরি রক্তের প্রয়োজনে আপনার সাথে যোগাযোগ করছি।`);
            return `https://wa.me/${cleanPhone}?text=${msg}`;
        }

        function initAppUserSession() {
            if(currentUser) {
                const userRef = ref(rtdb, 'users/' + currentUser.phone);
                onValue(userRef, (snap) => {
                    if(snap.exists()) {
                        const val = snap.val();
                        if(val.isBlocked) {
                            alert('আপনার অ্যাকাউন্টটি ব্লক করা হয়েছে!');
                            handleLogout();
                            return;
                        }
                        currentUser = { ...val, uid: currentUser.phone };
                        localStorage.setItem('rtdb_current_user', JSON.stringify(currentUser));
                    }
                });

                const donorsRef = ref(rtdb, 'donors');
                onValue(donorsRef, (snapshot) => {
                    const data = snapshot.val();
                    if(data) {
                        Object.values(data).forEach(d => {
                            if(d.uid === currentUser.phone || d.phone === currentUser.phone) {
                                currentUserDonorProfile = d;
                            }
                        });
                    }
                });
                startSmartNotificationListener();
            }
            listenForInAppNotifications();
        }

        function startSmartNotificationListener() {
            const notifSettings = JSON.parse(localStorage.getItem('smart_notif_filter') || '{"enabled":true,"district":true,"upazila":false,"group":true}');
            if (!notifSettings.enabled) return;

            onSnapshot(collection(db, "bloodRequests"), (snapshot) => {
                snapshot.docChanges().forEach((change) => {
                    if (change.type === "added") {
                        const r = change.doc.data();
                        if (Date.now() - (r.timestamp || 0) < 60000 && currentUserDonorProfile) {
                            let match = true;
                            if (notifSettings.group && r.group !== currentUserDonorProfile.group) match = false;
                            if (notifSettings.district && r.district !== currentUserDonorProfile.district) match = false;
                            if (notifSettings.upazila && currentUserDonorProfile.upazila && !r.address?.includes(currentUserDonorProfile.upazila)) match = false;

                            if (match) {

        function triggerDeviceNotification(title, body) {

        window.pushInAppNotification = function(title, body) {

        };

        function listenForInAppNotifications() {
            const notifRef = ref(rtdb, 'app_notifications');
            const sevenDaysInMs = 7 * 24 * 60 * 60 * 1000;
            const now = Date.now();

            onValue(notifRef, (snapshot) => {
                const data = snapshot.val();
                let unreadCount = 0;
                if(data) {
                    Object.entries(data).forEach(([key, n]) => {
                        if(now - (n.time || 0) > sevenDaysInMs) {
                            remove(ref(rtdb, `app_notifications/${key}`));
                        } else if(!n.isRead) {
                            unreadCount++;
                        }
                    });
                }
                const badge = document.getElementById('notif-badge');
                if(badge) {
                    if(unreadCount > 0) {
                        badge.innerText = unreadCount;
                        badge.classList.remove('hidden');
                        badge.classList.add('flex');
                    } else {
                        badge.classList.remove('flex');
                        badge.classList.add('hidden');
                    }
                }
            });
        }

        window.loadInAppNotificationsList = function() {
            const container = document.getElementById('notifications-list');
            if(!container) return;
            const notifRef = ref(rtdb, 'app_notifications');
            onValue(notifRef, (snapshot) => {
                const data = snapshot.val();
                container.innerHTML = "";
                if(!data) {
                    container.innerHTML = `<div class="bg-white p-8 rounded-2xl text-center text-xs text-slate-400 border">কোনো নতুন নোটিফিকেশন নেই।</div>`;
                    return;
                }

                let notifs = [];
                Object.entries(data).forEach(([key, n]) => {
                    notifs.push({ key, ...n });
                });

                notifs.sort((a, b) => (b.time || 0) - (a.time || 0));

                notifs.forEach(n => {
                    container.innerHTML += `
                        <div onclick="markSingleNotificationRead('${n.key}')" class="p-3.5 bg-white border ${n.isRead ? 'border-slate-100 opacity-75' : 'border-red-200 shadow-sm'} rounded-2xl space-y-1 cursor-pointer transition">
                            <div class="flex justify-between items-start">
                                <h4 class="font-bold text-slate-800 text-xs flex items-center gap-1.5">
                                    ${!n.isRead ? '<span class="w-2 h-2 rounded-full bg-red-600 inline-block"></span>' : ''}
                                    ${n.title}
                                </h4>
                                <span class="text-[9px] text-slate-400">${formatBanglaDate(n.time)}</span>
                            </div>
                            <p class="text-slate-600 text-[11px] leading-relaxed font-light">${n.body}</p>
                        </div>
                    `;
                });
            }, { onlyOnce: true });
        };

        window.markSingleNotificationRead = async function(key) {
            try {
                await update(ref(rtdb, `app_notifications/${key}`), { isRead: true });
                loadInAppNotificationsList();
            } catch(e) { console.error(e); }
        };

        window.markAllNotificationsAsRead = async function() {
            const notifRef = ref(rtdb, 'app_notifications');
            const snapshot = await get(notifRef);
            if(snapshot.exists()) {
                const updates = {};
                Object.keys(snapshot.val()).forEach(key => {
                    updates[`${key}/isRead`] = true;
                });
                await update(notifRef, updates);
                alert('সকল নোটিফিকেশন পড়া হয়েছে হিসেবে চিহ্নিত করা হয়েছে!');

                return;

            try {
                const sosRef = push(ref(rtdb, 'sosAlerts'));
                await set(sosRef, {
                    patient: patient || 'জরুরি রোগী',
                    hospital: hosp,
                    phone: phone,
                    time: Date.now(),
                    status: 'Active'

                triggerDeviceNotification("🚨 জরুরি SOS রক্ত ওয়ান্টেড!", `হাসপাতাল: ${hosp}\nযোগাযোগ: ${phone}`);

        window.toggleDeveloperAccordion = function() {
            const content = document.getElementById('dev-accordion-content');
            const arrow = document.getElementById('dev-accordion-arrow');
            if(!content || !arrow) return;

            if(content.classList.contains('hidden')) {
                content.classList.remove('hidden');
                arrow.classList.add('rotate-180');
            } else {
                content.classList.add('hidden');
                arrow.classList.remove('rotate-180');
            }
        };

        window.checkPasswordStrengthLive = function(pass) {
            const bar = document.getElementById('pass-strength-bar');
            const text = document.getElementById('pass-strength-text');
            if (!pass) {
                bar.style.width = '0%';
                text.innerText = 'পাসওয়ার্ডের শক্তি: লিখুন...';
                text.className = 'text-[10px] text-slate-400 block mt-1';
                return;
            }

            let score = 0;
            if (pass.length >= 6) score += 25;
            if (pass.length >= 8) score += 25;
            if (/[0-9]/.test(pass)) score += 25;
            if (/[^A-Za-z0-9]/.test(pass) || /[A-Z]/.test(pass)) score += 25;

            bar.style.width = `${score}%`;
            if (score <= 25) {
                bar.className = 'h-full bg-rose-500';
                text.innerText = 'দুর্বল পাসওয়ার্ড (অক্ষর ও সংখ্যা যুক্ত করুন)';
                text.className = 'text-[10px] text-rose-500 font-semibold block mt-1';
            } else if (score <= 75) {
                bar.className = 'h-full bg-amber-500';
                text.innerText = 'মাঝারি মানের পাসওয়ার্ড (আরও শক্তিশালী করুন)';
                text.className = 'text-[10px] text-amber-600 font-semibold block mt-1';
            } else {
                bar.className = 'h-full bg-emerald-500';
                text.innerText = 'খুব শক্তিশালী পাসওয়ার্ড!';
                text.className = 'text-[10px] text-emerald-600 font-bold block mt-1';
            }
        };

        window.executeAdvancedPasswordChange = async function() {
            const currentPass = document.getElementById('current-verify-pass').value.trim();
            const newPass = document.getElementById('new-secure-pass').value.trim();
            const confirmPass = document.getElementById('confirm-secure-pass').value.trim();

            if (!currentPass || !newPass || !confirmPass) {
                alert('দয়া করে সকল পাসওয়ার্ড ফিল্ড পূরণ করুন!');
                return;
            }

            if (newPass.length < 6) {
                alert('নতুন পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে!');
                return;
            }

            if (newPass !== confirmPass) {
                alert('নতুন পাসওয়ার্ড ও কনফার্ম পাসওয়ার্ড মিলছে না!');
                return;
            }

            try {
                const userRef = ref(rtdb, 'users/' + currentUser.phone);
                const snap = await get(userRef);
                if(snap.exists()) {
                    const userData = snap.val();
                    if(userData.password !== currentPass) {
                        alert('আপনার বর্তমান পাসওয়ার্ডটি সঠিক নয়!');
                        return;
                    }

                    await update(userRef, { password: newPass, updatedAt: Date.now() });
                    currentUser.password = newPass;
                    localStorage.setItem('rtdb_current_user', JSON.stringify(currentUser));
                    alert('✅ অভিনন্দন! আপনার পাসওয়ার্ড সফলভাবে পরিবর্তিত হয়েছে।');
                    renderSettingsSection();
                }
            } catch (error) {
                alert('পাসওয়ার্ড পরিবর্তনে সমস্যা: ' + error.message);
            }
        };

            const hidePhone = document.getElementById('edit-priv-hide-phone').checked;

                alert('দয়া করে নাম এবং জেলা ফিল্ড পূরণ করুন!');

        window.detectUserCurrentLocation = function() {
            const locDisplay = document.getElementById('current-location-display');
            if ("geolocation" in navigator) {
                locDisplay.innerHTML = `<i class="fa-solid fa-spinner animate-spin text-red-600"></i> সন্ধান চলছে...`;
                navigator.geolocation.getCurrentPosition(async (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    try {
                        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
                        const data = await res.json();
                        const detected = data.address.state_district || data.address.city || data.address.state || "বাংলাদেশ";
                        locDisplay.innerText = detected;
                        localStorage.setItem('detected_location', detected);
                        alert(`আপনার বর্তমান লোকেশন শনাক্ত হয়েছে: ${detected}`);
                    } catch(e) {
                        locDisplay.innerText = `ল্যাট: ${lat.toFixed(2)}, লং: ${lon.toFixed(2)}`;
                        localStorage.setItem('detected_location', `${lat.toFixed(2)}, ${lon.toFixed(2)}`);
                    }
                }, (error) => {
                    alert('লোকেশন পারমিশন পাওয়া যায়নি: ' + error.message);
                    locDisplay.innerText = 'ব্যর্থ হয়েছে';
                });

                alert('আপনার ব্রাউজারে জিওলোকেশন সুবিধা নেই।');
            }

        window.setAuthMode = function(mode) {
            currentAuthMode = mode;

        window.togglePasswordVisibility = function(inputId, btn) {
            const el = document.getElementById(inputId);
            if (el.type === "password") {
                el.type = "text";
                btn.innerHTML = '<i class="fa-solid fa-eye-slash text-xs"></i>';
            } else {
                el.type = "password";
                btn.innerHTML = '<i class="fa-solid fa-eye text-xs"></i>';
            }
        };

        window.handleLogin = async function() {
            let phone = cleanPhoneNumber(document.getElementById('auth-phone').value.trim());
            let pass = document.getElementById('auth-pass').value.trim();

            if(!phone || phone.length < 11) { alert('সঠিক মোবাইল নম্বর লিখুন!'); return; }
            if(!pass) { alert('পাসওয়ার্ড লিখুন!'); return; }

            try {
                const userRef = ref(rtdb, 'users/' + phone);
                const snap = await get(userRef);
                if(!snap.exists()) {
                    alert('এই নম্বরে কোনো অ্যাকাউন্ট পাওয়া যায়নি! আগে রেজিস্ট্রেশন করুন।');
                    return;
                }

                const userData = snap.val();
                if(userData.isBlocked) {
                    alert('আপনার অ্যাকাউন্টটি ব্লক করা হয়েছে!');
                    return;
                }

                if(userData.password !== pass) {
                    alert('ভুল পাসওয়ার্ড! আবার চেষ্টা করুন।');
                    return;
                }

                currentUser = { ...userData, uid: phone };
                localStorage.setItem('rtdb_current_user', JSON.stringify(currentUser));
                alert('লগইন সফল হয়েছে!');
                initAppUserSession();
                switchTab('profile');
            } catch(e) {
                alert('লগইন ব্যর্থ: ' + e.message);
            }
        };

        window.handleSignupStep1 = async function() {
            let name = document.getElementById('auth-name').value.trim();
            let phone = cleanPhoneNumber(document.getElementById('auth-phone').value.trim());
            let pass = document.getElementById('auth-pass').value.trim();

            if(!name) { alert('আপনার পূর্ণ নাম লিখুন!'); return; }
            if(!phone || phone.length < 11) { alert('সঠিক ১১ ডিজিটের মোবাইল নম্বর দিন!'); return; }
            if(!pass || pass.length < 6) { alert('পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে!'); return; }

            try {
                const userSnap = await get(ref(rtdb, 'users/' + phone));
                if(userSnap.exists()) {
                    alert('এই মোবাইল নম্বরে ইতোমধ্যে অ্যাকাউন্ট রয়েছে! লগইন করুন।');
                    setAuthMode('login');
                    return;
                }

                generatedOtp = Math.floor(1000 + Math.random() * 9000).toString();
                otpTargetPhone = phone;

                let formattedPhone = '88' + phone;
                const smsMessage = encodeURIComponent(`রক্তদান প্রো অ্যাকাউন্টের ভেরিফিকেশন কোড হলো: ${generatedOtp}।`);
                const apiUrl = `https://bulksmsbd.net/api/smsapi?api_key=${SMS_GATEWAY_CONFIG.api_key}&type=text&number=${formattedPhone}&senderid=${SMS_GATEWAY_CONFIG.senderid}&message=${smsMessage}`;

                await set(ref(rtdb, 'sms_otps/' + phone), {
                    otp: generatedOtp,
                    time: Date.now(),
                    expiresAt: Date.now() + (5 * 60 * 1000)
                });

                try { await fetch(apiUrl, { mode: 'no-cors' }); } catch(err) { console.log(err); }

                renderSignupOtpVerification(name, phone, pass);
            } catch(e) {
                alert('রেজিস্ট্রেশন ব্যর্থ: ' + e.message);
            }
        };

        function renderSignupOtpVerification(name, phone, pass) {
            const screen = document.getElementById('app-screen');
            screen.innerHTML = `
                <div class="bg-white p-6 rounded-3xl shadow-sm border space-y-4 my-auto text-xs">
                    <div class="text-center">

                        <p class="text-slate-400 mt-1">${phone} নম্বরে পাঠানো ৪ ডিজিটের SMS OTP কোডটি লিখুন</p>
                    </div>
                    <div>
                        <input type="text" id="reg-input-otp" placeholder="••••" maxlength="4" class="w-full p-3 text-center tracking-widest text-lg font-bold bg-slate-50 border rounded-xl focus:outline-none focus:border-red-500">
                    </div>
                    <button onclick="verifySignupOtp('${name}', '${phone}', '${pass}')" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3.5 rounded-xl shadow transition">
                        যাচাই করে অ্যাকাউন্ট তৈরি করুন

                    <button onclick="renderProfileSection()" class="w-full text-slate-400 text-center block pt-1">ফিরে যান</button>
                </div>
            `;
        }

        window.verifySignupOtp = async function(name, phone, pass) {
            const inputOtp = document.getElementById('reg-input-otp').value.trim();
            if(!inputOtp || inputOtp !== generatedOtp) {
                alert('ভুল ওটিপি কোড! আবার যাচাই করে লিখুন।');
                return;
            }

            try {
                const newUser = {
                    name: name,
                    phone: phone,
                    password: pass,
                    isBlocked: false,
                    role: 'donor',
                    createdAt: Date.now()
                };

                await set(ref(rtdb, 'users/' + phone), newUser);
                await remove(ref(rtdb, 'sms_otps/' + phone));

                currentUser = { ...newUser, uid: phone };
                localStorage.setItem('rtdb_current_user', JSON.stringify(currentUser));

                alert('✅ অভিনন্দন! আপনার অ্যাকাউন্ট সফলভাবে তৈরি হয়েছে।');
                initAppUserSession();
                switchTab('profile');
            } catch(e) {
                alert('অ্যাকাউন্ট সংরক্ষণে সমস্যা: ' + e.message);
            }
        };

        window.sendRealSmsOtp = async function() {
            let phone = cleanPhoneNumber(document.getElementById('reset-phone').value.trim());
            if(!phone || phone.length < 11) {
                alert('দয়া করে সঠিক ১১ ডিজিটের মোবাইল নম্বর লিখুন!');
                return;
            }

            try {
                const userSnap = await get(ref(rtdb, 'users/' + phone));
                if(!userSnap.exists()) {
                    alert('এই নম্বরে কোনো নিবন্ধিত অ্যাকাউন্ট পাওয়া যায়নি!');
                    return;
                }

                let formattedPhone = '88' + phone;
                const sendBtn = document.getElementById('btn-send-otp');
                sendBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> এসএমএস পাঠানো হচ্ছে...`;
                sendBtn.disabled = true;

                generatedOtp = Math.floor(1000 + Math.random() * 9000).toString();
                otpTargetPhone = phone;

                const smsMessage = encodeURIComponent(`রক্তদান প্রো পাসওয়ার্ড রিসেট ওটিপি কোড হলো: ${generatedOtp}। কোডটি ৫ মিনিটের জন্য প্রযোজ্য।`);
                const apiUrl = `https://bulksmsbd.net/api/smsapi?api_key=${SMS_GATEWAY_CONFIG.api_key}&type=text&number=${formattedPhone}&senderid=${SMS_GATEWAY_CONFIG.senderid}&message=${smsMessage}`;

                await set(ref(rtdb, 'sms_otps/' + phone), {
                    otp: generatedOtp,
                    time: Date.now(),
                    expiresAt: Date.now() + (5 * 60 * 1000)
                });

                try { await fetch(apiUrl, { mode: 'no-cors' }); } catch(netErr) { console.log(netErr); }

                alert(`✅ ${phone} নম্বরে ৪ ডিজিটের SMS OTP পাঠানো হয়েছে!`);

                document.getElementById('otp-step-1').classList.add('hidden');
                document.getElementById('otp-step-2').classList.remove('hidden');
                document.getElementById('otp-phone-display').innerText = phone;

                startOtpCountdownTimer(180);
            } catch(e) {
                alert('এসএমএস পাঠাতে সমস্যা: ' + e.message);
                const btn = document.getElementById('btn-send-otp');
                if(btn) {
                    btn.innerHTML = `ওটিপি কোড পাঠান (Send SMS OTP)`;
                    btn.disabled = false;
                }
            }
        };

        function startOtpCountdownTimer(duration) {
            let timer = duration, minutes, seconds;
            const timerDisplay = document.getElementById('otp-timer');
            if (otpTimerInterval) clearInterval(otpTimerInterval);

            otpTimerInterval = setInterval(() => {
                minutes = parseInt(timer / 60, 10);
                seconds = parseInt(timer % 60, 10);

                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                if (timerDisplay) {
                    timerDisplay.textContent = `কোডের মেয়াদ: ${minutes}:${seconds} মিনিট`;
                }

                if (--timer < 0) {
                    clearInterval(otpTimerInterval);
                    if (timerDisplay) timerDisplay.textContent = "ওটিপির মেয়াদ শেষ! পুনরায় কোড পাঠান।";
                    generatedOtp = null;
                }
            }, 1000);
        }

        window.verifyRealOtpAndResetPassword = async function() {
            const inputOtp = document.getElementById('input-otp').value.trim();
            const newPass = document.getElementById('reset-new-pass').value.trim();

            if(!inputOtp) { alert('OTP কোডটি লিখুন!'); return; }
            if(!newPass || newPass.length < 6) { alert('নতুন পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে!'); return; }

            try {
                const otpSnap = await get(ref(rtdb, 'sms_otps/' + otpTargetPhone));
                if (!otpSnap.exists()) {
                    alert('ওটিপি পাওয়া যায়নি বা মেয়াদ শেষ হয়ে গেছে!');
                    return;
                }

                const otpData = otpSnap.val();
                if (Date.now() > otpData.expiresAt) {
                    alert('ওটিপির সময়সীমা পার হয়ে গেছে!');
                    return;
                }

                if (inputOtp !== otpData.otp && inputOtp !== generatedOtp) {
                    alert('ভুল OTP কোড! আবার চেষ্টা করুন।');
                    return;
                }

                await update(ref(rtdb, 'users/' + otpTargetPhone), {
                    password: newPass,
                    updatedAt: Date.now()
                });

                await remove(ref(rtdb, 'sms_otps/' + otpTargetPhone));
                if (otpTimerInterval) clearInterval(otpTimerInterval);

                alert('✅ অভিনন্দন! আপনার পাসওয়ার্ড সফলভাবে আপডেট হয়েছে। এখন লগইন করুন।');
                setAuthMode('login');
            } catch(e) {
                alert('ত্রুটি: ' + e.message);
            }
        };

        window.loadInstantLiveRequests = function(selectedGroup = '') {
            let container = document.getElementById('live-requests-container');
            if(!container) return;

            if (unsubscribeLiveRequests) {
                unsubscribeLiveRequests();
            }

            try {
                unsubscribeLiveRequests = onSnapshot(collection(db, "bloodRequests"), (querySnapshot) => {
                    let items = [];
                    const sevenDaysInMs = 7 * 24 * 60 * 60 * 1000;
                    const now = Date.now();

                    querySnapshot.forEach((docSnap) => {
                        let data = docSnap.data();
                        data.id = docSnap.id;

                        if (data.timestamp && (now - data.timestamp > sevenDaysInMs)) {
                            deleteDoc(doc(db, "bloodRequests", docSnap.id)).catch(err => console.log("Auto delete err:", err));
                        } else {
                            if (!selectedGroup || data.group === selectedGroup) {
                                items.push(data);
                            }
                        }
                    });

                    items.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

                    container.innerHTML = "";
                    if(items.length === 0) {
                        container.innerHTML = `<div class="bg-white p-6 rounded-2xl text-center shadow-sm border"><p class="text-xs text-slate-400">${selectedGroup ? selectedGroup + ' গ্রুপের কোনো রক্তের অনুরোধ নেই।' : 'কোনো লাইভ রক্তের অনুরোধ নেই।'}</p></div>`;

                                <i class="fa-brands fa-whatsapp text-sm"></i> WhatsApp
                            </a>
                            <a href="tel:${d.phone}" class="bg-red-600 text-white px-2.5 py-1.5 rounded-xl font-semibold shadow hover:bg-red-700 transition flex items-center gap-1">
                                <i class="fa-solid fa-phone"></i> কল
                            </a>

                        `;

                    container.innerHTML += `
                        <div class="bg-white p-4 rounded-2xl shadow-sm border text-xs space-y-2.5">
                            <div class="flex items-center space-x-3">
                                <img src="${d.img}" class="w-12 h-12 rounded-full object-cover border" onerror="this.src='${GLOBAL_APP_LOGO}'">
                                <div class="flex-1">
                                    <div class="flex justify-between items-start">
                                        <h4 class="font-bold text-slate-800 text-sm">${d.name}</h4>
                                        <span class="bg-red-50 text-red-600 font-black px-2.5 py-0.5 rounded-lg border text-xs">${d.group}</span>
                                    </div>
                                    <p class="text-slate-500 text-[11px]"><i class="fa-solid fa-location-dot text-red-500"></i> ${displayLoc}</p>
                                </div>
                            </div>
                            <div class="flex justify-between items-center pt-2 border-t text-[11px]">
                                <div>
                                    <p class="text-slate-500">মোট দান: <b>${d.totalDonated || 0} বার</b></p>
                                    ${availabilityBadge}
                                </div>
                                ${contactButtons}
                            </div>
                        </div>
                    `;
                });
            }, { onlyOnce: true });
        };

        async function loadHospitalsUser() {
            const hospRef = ref(rtdb, 'hospitals');
            onValue(hospRef, (snapshot) => {
                const data = snapshot.val();
                globalHospitalsList = [];
                if(data) {
                    Object.values(data).forEach(h => globalHospitalsList.push(h));
                }
                renderHospitalsList(globalHospitalsList);
            });
        }

        function renderHospitalsList(list) {
            let container = document.getElementById('hospitals-list');
            if(!container) return;
            container.innerHTML = "";
            if(list.length === 0) {
                container.innerHTML = `<div class="bg-white p-6 rounded-2xl text-center text-xs text-slate-400 border">কোনো হাসপাতাল বা ব্লাড ব্যাংক পাওয়া যায়নি।</div>`;
                return;
            }
            list.forEach(h => {
                const waLink = getWhatsAppLink(h.phone, h.name);
                container.innerHTML += `
                    <div class="bg-white p-4 rounded-2xl shadow-sm border text-xs space-y-2.5">
                        <div>
                            <h3 class="font-bold text-slate-800 text-sm mb-0.5">${h.name}</h3>
                            <p class="text-slate-500"><i class="fa-solid fa-location-dot text-red-500 mr-1"></i> ${h.location} | হটলাইন: <b class="text-slate-700">${h.phone}</b></p>
                        </div>
                        <div class="flex justify-end items-center space-x-2 pt-2 border-t text-[11px]">
                            <a href="${waLink}" target="_blank" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-xl font-semibold shadow transition flex items-center gap-1">
                                <i class="fa-brands fa-whatsapp text-sm"></i> চ্যাট
                            </a>
                            <a href="tel:${h.phone}" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-xl font-semibold shadow transition flex items-center gap-1">
                                <i class="fa-solid fa-phone text-xs"></i> কল করুন
                            </a>
                        </div>
                    </div>
                `;
            });
        }

        window.filterHospitalsList = function(keyword) {
            keyword = (keyword || '').toLowerCase().trim();
            if(!keyword) {
                renderHospitalsList(globalHospitalsList);
            } else {
                const filtered = globalHospitalsList.filter(h => 
                    (h.name || '').toLowerCase().includes(keyword) || 
                    (h.location || '').toLowerCase().includes(keyword) ||
                    (h.phone || '').includes(keyword)
                );
                renderHospitalsList(filtered);
            }
        };

        window.searchRealtimeDonors = function() {
            let targetGroup = document.getElementById('search-group').value;
            let resDiv = document.getElementById('rtdb-donor-results');
            resDiv.innerHTML = `<div class="text-center py-4 text-xs text-slate-400"><i class="fa-solid fa-robot text-red-600 animate-spin text-base block mb-1"></i> AI স্মার্ট ম্যাচিং হচ্ছে...</div>`;

            const compatibilityChart = {
                'A+': ['A+', 'A-', 'O+', 'O-'],
                'A-': ['A-', 'O-'],
                'B+': ['B+', 'B-', 'O+', 'O-'],
                'B-': ['B-', 'O-'],
                'AB+': ['AB+', 'AB-', 'A+', 'A-', 'B+', 'B-', 'O+', 'O-'],
                'AB-': ['AB-', 'A-', 'B-', 'O-'],
                'O+': ['O+', 'O-'],
                'O-': ['O-']
            };

            const donorsRef = ref(rtdb, 'donors');
            onValue(donorsRef, (snapshot) => {
                const data = snapshot.val();
                resDiv.innerHTML = "";
                if(!data) {
                    resDiv.innerHTML = `<div class="bg-white p-4 rounded-2xl text-center text-xs text-slate-400">কোনো দাতা নেই।</div>`;
                    return;
                }

                let matches = [];
                let allowedGroups = targetGroup && compatibilityChart[targetGroup] ? compatibilityChart[targetGroup] : null;

                Object.values(data).forEach(d => {
                    if (d.status === 'Approved') {
                        let score = 0;
                        let isExact = false;

                        if (!targetGroup) {
                            score = 80;
                        } else if (d.group === targetGroup) {
                            score = 98;
                            isExact = true;
                        } else if (allowedGroups && allowedGroups.includes(d.group)) {
                            score = 85;
                        } else {
                            return;
                        }

                        if (!d.unavailable) score += 2;
                        if (Number(d.totalDonated) > 2) score += 2;

                        matches.push({ ...d, aiScore: Math.min(score, 100), isExact });
                    }
                });

                matches.sort((a, b) => b.aiScore - a.aiScore);

                if (matches.length === 0) {
                    resDiv.innerHTML = `<div class="bg-white p-4 rounded-2xl text-center text-xs text-slate-400">${targetGroup ? targetGroup + ' গ্রুপের জন্য কোনো উপযুক্ত রক্তদাতা পাওয়া যায়নি।' : 'কোনো দাতা পাওয়া যায়নি।'}</div>`;
                    return;
                }

                matches.forEach(d => {
                    let displayLoc = d.onlyDist ? `${d.district} (জেলা)` : `${d.upazila ? d.upazila + ', ' : ''}${d.district}`;
                    let contactArea = d.hidePhone ? 
                        `<span class="text-slate-400 text-[10px]">গোপন নম্বর</span>` : 
                        `
                        <div class="flex items-center space-x-1">
                            <a href="${getWhatsAppLink(d.phone, d.name)}" target="_blank" class="bg-emerald-600 text-white p-2 rounded-xl text-xs"><i class="fa-brands fa-whatsapp"></i></a>
                            <a href="tel:${d.phone}" class="bg-red-600 text-white p-2 rounded-xl text-xs"><i class="fa-solid fa-phone"></i></a>
                        </div>
                        `;

                    resDiv.innerHTML += `
                        <div class="bg-white p-4 rounded-2xl border shadow-sm text-xs flex justify-between items-center">
                            <div>
                                <b>${d.name}</b> <span class="text-red-600 font-bold">(${d.group})</span>
                                ${d.isExact ? '<span class="text-[9px] bg-red-100 text-red-600 font-bold px-1.5 py-0.5 rounded ml-1">সরাসরি ম্যাচ</span>' : '<span class="text-[9px] bg-blue-100 text-blue-600 font-bold px-1.5 py-0.5 rounded ml-1">কম্প্যাটিবল</span>'}
                                <br>
                                <span class="text-slate-500">লোকেশন: ${displayLoc}</span><br>
                                <span class="text-[10px] text-emerald-600 font-medium">✨ AI রেটিং: ${d.aiScore}% ম্যাচ</span>
                            </div>
                            ${contactArea}
                        </div>
                    `;
                });
            }, { onlyOnce: true });
        };

        window.handleLogout = function() {
            currentUser = null;
            currentUserDonorProfile = null;
            localStorage.removeItem('rtdb_current_user');
            alert('লগআউট সফল!');
            switchTab('profile');
        };

        window.handleReset = function() {
            renderForgotPasswordModal();
        };

        initAppUserSession();
        applyLanguageSettings();
        switchTab('home', document.querySelector('.nav-btn'));
		
        // ==========================================
        // 📢 ১০০% কার্যকর অ্যাড লিসেনার (Adsterra & Start.io)
        // ==========================================
// 📢 ১০০% কার্যকর অ্যাড ও পপ-আন্ডার লিসেনার (Firefox & Chrome)
// ==========================================
let activeSmartlinkUrl = null;
let popunderInitialized = false;

function initAppAdListener() {
    const adRef = ref(rtdb, 'ad_settings');
    
    onValue(adRef, (snapshot) => {
        const ad = snapshot.val();
        const wrapper = document.getElementById('app-ad-banner-wrapper');
        const slot = document.getElementById('app-ad-banner-slot');

        if (!wrapper || !slot) return;

        // ১. অ্যাডমিন থেকে অ্যাড বন্ধ থাকলে সম্পূর্ণ লুকানো থাকবে
        if (!ad || !ad.enabled || ad.network === 'none') {
            wrapper.classList.add('hidden');
            slot.innerHTML = '';
            activeSmartlinkUrl = null;
            return;
        }

        // ২. ব্যানার অ্যাড প্রদর্শন
        wrapper.classList.remove('hidden');

        // Adsterra ব্যানার রেন্ডারিং
        if (ad.network === 'adsterra' || ad.network === 'both') {
            if (ad.adsterraBanner && ad.adsterraBanner.trim() !== "") {
                slot.innerHTML = '';
                
                let bannerCode = ad.adsterraBanner.trim();
                bannerCode = bannerCode.replace(/src=["']\/\//gi, 'src="https://');
                bannerCode = bannerCode.replace(/src=\/\//gi, 'src=https://');

                const iframe = document.createElement('iframe');
                iframe.setAttribute('frameborder', '0');
                iframe.setAttribute('scrolling', 'no');
                iframe.style.width = '320px';
                iframe.style.height = '50px';
                iframe.style.border = 'none';
                iframe.style.overflow = 'hidden';

                const adDocContent = `<!DOCTYPE html>
                <html>
                <head>
                    <meta charset="utf-8">
                    <style>
                        * { margin: 0; padding: 0; }
                        body { display: flex; justify-content: center; align-items: center; background: transparent; overflow: hidden; }
                    </style>
                </head>
                <body>
                    ${bannerCode}
                </body>
                </html>`;

                try {
                    const blob = new Blob([adDocContent], { type: 'text/html' });
                    iframe.src = URL.createObjectURL(blob);
                } catch (e) {
                    iframe.srcdoc = adDocContent;
                }

                slot.appendChild(iframe);
            }
        }

        // ৩. 🌟 ফায়ারফক্স-ফ্রেন্ডলি Adsterra Smartlink / Popunder মেথড
        if (ad.adsterraSmartlink && ad.adsterraSmartlink.trim().startsWith('http')) {
            activeSmartlinkUrl = ad.adsterraSmartlink.trim();
            setupFirefoxPopunder();
        } else {
            activeSmartlinkUrl = null;
        }

        // Start.io App ID কনফিগারেশন
        if ((ad.network === 'startio' || ad.network === 'both') && ad.startioAppId) {
            console.log("Start.io App ID Active:", ad.startioAppId);
        }
    });
}

// ফায়ারফক্সের পপআপ ব্লকার বাইপাস করার জন্য সরাসরি ইউজার ক্লিক হ্যান্ডলার
function setupFirefoxPopunder() {
    if (popunderInitialized) return;
    popunderInitialized = true;

    const firePopunder = function (e) {
        if (!activeSmartlinkUrl) return;

        // বারবার যেন ইউজার বিরক্ত না হয় (৩ মিনিট পর পর একবার পপআপ হবে)
        const lastPopTime = sessionStorage.getItem('ad_last_pop_time');
        const now = Date.now();
        if (lastPopTime && (now - parseInt(lastPopTime) < 180000)) {
            return;
        }

        // ইউজার ক্লিকে সরাসরি উইন্ডো ওপেন (ফায়ারফক্স কোনোভাবেই ব্লক করতে পারবে না)
        sessionStorage.setItem('ad_last_pop_time', now.toString());
        const popTab = window.open(activeSmartlinkUrl, '_blank');
        if (popTab) {
            popTab.focus();
        }
    };

    // ইউজারের প্রথম ক্লিকের সাথে সাথেই পপ-আন্ডার ট্রিগার হবে
    document.addEventListener('click', firePopunder, { passive: true });
    document.addEventListener('touchend', firePopunder, { passive: true });
}

// অ্যাপ চালু হওয়ার সাথে সাথে লিসেনার শুরু হবে
initAppAdListener();
    </script>
